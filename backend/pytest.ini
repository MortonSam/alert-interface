[pytest]
# Every async test runs on one session-wide event loop. The engines in app.database
# are module-level and pool connections; a pooled asyncpg connection is bound to the
# loop that opened it, so tests on separate loops would hand each other dead
# connections ("Future attached to a different loop"). One loop, one pool.
asyncio_mode = strict
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
